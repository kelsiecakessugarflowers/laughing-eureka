<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Find Your Perfect Sugar Flower Match | Sugar Flowers by Kelsie Cakes</title>
<meta name="description" content="Five questions to find the right sugar flowers for your wedding cake: ready to ship, made to order, curated or fully custom.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="brand.css">
<style>
/* Same look as the Price Estimator (estimator.kelsiecakes.com): cream page, white cards with banded headings, plum buttons */
:root{--bg:var(--kc-bg);--card:var(--kc-card);--ink:var(--kc-plum);--text:var(--kc-text);--muted:var(--kc-muted);--line:var(--kc-line);--accent:var(--kc-accent);--soft:var(--kc-accent-soft)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--kc-font-body)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:center}
header .logo{height:58px;width:auto;display:block}
main{max-width:640px;margin:0 auto;padding:12px}
section{background:var(--card);border:1px solid var(--line);padding:14px;margin-bottom:12px}
h2.band{font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin:-14px -14px 12px;padding:12px 14px;background:var(--soft);border-bottom:1px solid var(--line);font-weight:700}
h1.title{font-weight:600;color:var(--ink);font-size:24px;line-height:1.25;margin:14px 2px 8px;text-align:center}
.intro{margin:0 2px 18px;color:var(--muted);font-size:16px;text-align:center}
.hero{width:100%;height:auto;display:block;border:1px solid var(--line)}
.center{text-align:center}
.muted{color:var(--muted);font-size:13px}
a{color:var(--accent)}
button,.btn{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:0;padding:12px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary,button.primary{background:var(--accent);border-color:var(--accent);color:var(--kc-white);font-weight:600}
.btn.primary:hover,button.primary:hover{background:var(--ink)}
.btn.secondary{background:var(--soft);color:var(--ink);border-color:var(--accent);font-weight:600}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wide{width:100%;text-align:center}
/* Questions */
.progress{height:6px;background:var(--soft);margin:2px 0 10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.counter{text-align:center;color:var(--muted);font-size:13px;margin:0}
h2.q{font-weight:600;color:var(--ink);font-size:22px;line-height:1.3;text-align:center;margin:6px 0 16px}
.opts{display:grid;gap:8px}
.opt{width:100%;text-align:left;padding:14px 16px;font-size:16px;line-height:1.35;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent);background:var(--soft)}
.opt.on{border-color:var(--accent);background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.opt[disabled]{cursor:default}
.back{border:none;background:none;color:var(--accent);font-weight:600;padding:0;margin-top:14px;text-decoration:underline}
/* Result */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.rtitle{font-size:24px;font-weight:600;color:var(--ink);margin:0 0 8px;line-height:1.2}
.bestfor{margin:8px 0 0;font-size:15px}
.bestfor b{color:var(--ink)}
.feat{margin:0;padding-left:0;list-style:none}
.feat li{margin:6px 0;padding-left:22px;position:relative;font-size:15px}
.feat li::before{content:"✓";position:absolute;left:0;color:var(--kc-mauve)}
.note{background:var(--soft);border-left:3px solid var(--accent);padding:10px 12px;margin:0;font-size:15px}
.ctas{display:flex;flex-direction:column;gap:8px;align-items:stretch;margin-top:12px}
@media (min-width:560px){.ctas{flex-direction:row;justify-content:center}.ctas .btn{min-width:220px;text-align:center}}
/* Email */
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:0;background:var(--card);color:var(--text)}
input.bad{border-color:var(--kc-berry);background:#fff7f8}
.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
#ts{margin-top:12px;display:flex;justify-content:center}
.msg{margin:10px 0 0;font-size:14px}
.msg.err{color:var(--kc-berry)}
.msg.ok{color:var(--kc-sage-deep)}
footer{text-align:center;padding:8px 16px 24px;color:var(--muted);font-size:12px}
footer img{width:220px;height:auto;display:block;margin:0 auto 10px}
footer a{color:var(--muted)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><img class="logo" src="logo-main.svg" alt="Sugar Flowers by Kelsie Cakes"></header>
<main id="app" aria-live="polite"></main>
<footer id="footer"></footer>
<script src="quiz.js"></script>
</body>
</html>
